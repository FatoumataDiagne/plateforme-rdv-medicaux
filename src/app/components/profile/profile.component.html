<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card profile-card">
        <div class="card-header profile-header">
          <h3 class="text-center"><i class="fas fa-user-circle me-2"></i>Mon Profil</h3>
        </div>

        <div class="card-body">
          <!-- Messages -->
          <div *ngIf="error" class="alert alert-danger custom-alert">
            <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
          </div>

          <div *ngIf="success" class="alert alert-success custom-alert">
            <i class="fas fa-check-circle me-2"></i>{{ success }}
          </div>

          <!-- Formulaire -->
          <form #profileForm="ngForm" (ngSubmit)="onSubmit()" class="profile-form">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3 form-group">
                  <label class="form-label"><i class="fas fa-user me-1"></i>Prénom</label>
                  <input type="text" class="form-control" 
                         [(ngModel)]="user.prenom" 
                         name="prenom">
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3 form-group">
                  <label class="form-label"><i class="fas fa-user me-1"></i>Nom</label>
                  <input type="text" class="form-control" 
                         [(ngModel)]="user.nom" 
                         name="nom">
                </div>
              </div>
            </div>

            <div class="mb-3 form-group">
              <label class="form-label"><i class="fas fa-envelope me-1"></i>Email</label>
              <input type="email" class="form-control" 
                     [(ngModel)]="user.email" 
                     name="email" 
                     readonly>
            </div>

            <div class="mb-3 form-group">
              <label class="form-label"><i class="fas fa-phone me-1"></i>Téléphone</label>
              <input type="tel" class="form-control" 
                     [(ngModel)]="user.telephone" 
                     name="telephone">
            </div>

            <div class="mb-3 form-group">
              <label class="form-label"><i class="fas fa-birthday-cake me-1"></i>Date de naissance</label>
              <input type="date" class="form-control" 
                     [(ngModel)]="user.date_naissance" 
                     name="date_naissance">
            </div>

            <div class="mb-3 form-group">
              <label class="form-label"><i class="fas fa-home me-1"></i>Adresse</label>
              <textarea class="form-control" 
                        [(ngModel)]="user.adresse" 
                        name="adresse" 
                        rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-update" [disabled]="loading">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              <i class="fas fa-save me-2" *ngIf="!loading"></i>
              {{ loading ? 'Mise à jour...' : 'Mettre à jour mon profil' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
